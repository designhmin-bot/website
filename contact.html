<main class="pt-32 pb-20 bg-surface">
  <div class="max-w-4xl mx-auto px-6 font-body text-on-surface">
    <header class="mb-12 text-center reveal-on-scroll">
      <h1 class="text-4xl font-extrabold tracking-tighter mb-4 uppercase font-headline text-primary">Store Proposal</h1>
      <p class="text-on-surface-variant text-sm max-w-lg mx-auto">Please provide the details of your proposed store location for our brand expansion.</p>
    </header>

    <form class="space-y-10 border-t border-surface-container-highest pt-12 reveal-on-scroll">
      <section>
        <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-4 text-primary">Brands *</label>
        <div class="flex flex-wrap gap-3">
          <label class="cursor-pointer">
            <input type="checkbox" class="hidden peer" name="brand" value="Oiso">
            <span class="px-6 py-2 border border-outline-variant text-sm transition-all peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary hover:border-primary inline-block">Oiso</span>
          </label>
          <label class="cursor-pointer">
            <input type="checkbox" class="hidden peer" name="brand" value="Neulbom">
            <span class="px-6 py-2 border border-outline-variant text-sm transition-all peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary hover:border-primary inline-block">Neulbom Garden</span>
          </label>
          <label class="cursor-pointer">
            <input type="checkbox" class="hidden peer" name="brand" value="MiMi">
            <span class="px-6 py-2 border border-outline-variant text-sm transition-all peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary hover:border-primary inline-block">MiMi Guksu</span>
          </label>
        </div>
      </section>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
        <section>
          <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-2 text-primary">Full Name *</label>
          <input type="text" required class="w-full bg-transparent border-b border-outline-variant py-2 focus:outline-none focus:border-primary transition-colors text-sm" placeholder="e.g. Jin-soo Kim">
        </section>
        <section>
          <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-2 text-primary">Contact Number *</label>
          <input type="tel" required class="w-full bg-transparent border-b border-outline-variant py-2 focus:outline-none focus:border-primary transition-colors text-sm" placeholder="010-0000-0000">
        </section>
      </div>

      <section>
        <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-4 text-primary">Store Type *</label>
        <div class="flex flex-wrap gap-8">
          <label class="flex items-center space-x-3 cursor-pointer group">
            <input type="radio" name="storeType" class="w-4 h-4 border-outline-variant text-primary focus:ring-primary">
            <span class="text-sm text-on-surface-variant group-hover:text-primary transition-colors">Owned Property</span>
          </label>
          <label class="flex items-center space-x-3 cursor-pointer group">
            <input type="radio" name="storeType" class="w-4 h-4 border-outline-variant text-primary focus:ring-primary">
            <span class="text-sm text-on-surface-variant group-hover:text-primary transition-colors">Leased Property</span>
          </label>
        </div>
      </section>

      <section class="space-y-6">
        <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-2 text-primary">Store Location *</label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <select class="bg-transparent border-b border-outline-variant py-2 focus:outline-none focus:border-primary text-sm">
            <option>Select Province</option>
            <option>Seoul</option>
            <option>Gyeonggi</option>
            <option>Busan</option>
          </select>
          <input type="text" placeholder="Street Address" class="md:col-span-2 bg-transparent border-b border-outline-variant py-2 focus:outline-none focus:border-primary text-sm">
        </div>
        <input type="text" placeholder="Detailed Address / Unit Number" class="w-full bg-transparent border-b border-outline-variant py-2 focus:outline-none focus:border-primary text-sm">
      </section>

      <section>
        <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-2 text-primary">Attachments (Store Photos/Plans)</label>
        <div class="mt-2 border-2 border-dashed border-outline-variant hover:border-primary transition-all p-12 text-center group cursor-pointer relative">
          <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" multiple>
          <span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-primary mb-2 transition-colors">cloud_upload</span>
          <p class="text-sm text-on-surface-variant">Click or drag files to upload</p>
          <p class="text-[10px] text-outline mt-1 uppercase tracking-widest">Max 50MB (JPG, PNG, PDF)</p>
        </div>
      </section>

      <div class="pt-10">
        <button type="submit" class="w-full bg-primary text-white py-5 uppercase tracking-[0.3em] text-xs font-bold hover:bg-primary-dim transition-all shadow-lg">
          Submit Proposal
        </button>
      </div>
    </form>
  </div>
</main>

<style>
    /* Ensure only the active slide is visible */
    .slide.active { opacity: 1 !important; z-index: 10; }
    .slide { z-index: 0; }
</style>

<script>
    // Intersection Observer for Scroll Reveals
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('is-visible');
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));

    // Refined Slideshow Logic
    let currentSlide = 0;
    const slides = document.querySelectorAll('#hero-slideshow .slide');
    
    function showNextSlide() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }

    if (slides.length > 0) {
        setInterval(showNextSlide, 5000);
    }

    // Smooth Parallax
    window.addEventListener('scroll', () => {
        const scrolled = window.pageYOffset;
        const activeImg = document.querySelector('.slide.active img');
        if (activeImg) {
            activeImg.style.transform = `translateY(${scrolled * 0.1}px)`;
        }
    });
</script>

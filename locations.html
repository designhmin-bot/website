<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>입점 제안 | KFood Solution</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Public+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#496455",
                        "surface": "#f9f9f7",
                        "outline-variant": "#adb3b0",
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Public Sans"],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Public Sans', sans-serif; }
        h1, .font-headline { font-family: 'Manrope', sans-serif; }
        
        /* 본아이에프 스타일 체크박스/라디오 버튼 커스텀 */
        .brand-btn:checked + span {
            background-color: #496455;
            color: white;
            border-color: #496455;
        }
        
        input[type="text"], input[type="tel"], select {
            border-radius: 0px !important;
        }
    </style>
</head>
<body class="bg-surface text-[#2d3432] antialiased">

<header class="bg-[#f9f9f7]/80 backdrop-blur-md fixed top-0 z-50 w-full border-b border-stone-200/50">
    <nav class="flex justify-between items-center w-full px-6 md:px-12 py-6 max-w-screen-2xl mx-auto">
        <div class="text-xl font-extrabold tracking-tighter text-primary uppercase font-headline">
            KFood Solution
        </div>
        <div class="hidden md:flex gap-10 items-center">
            <a class="text-stone-500 hover:text-primary transition-colors font-headline font-bold tracking-tight" href="index.html">Home</a>
            <a class="text-stone-500 hover:text-primary transition-colors font-headline font-bold tracking-tight" href="#">Brands</a>
            <a class="text-primary font-bold font-headline tracking-tight" href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<main class="pt-40 pb-24">
    <div class="max-w-4xl mx-auto px-6 font-body">
        
        <div class="mb-12 border-b-2 border-black pb-6">
            <h1 class="text-3xl font-extrabold tracking-tighter font-headline uppercase">입점 제안</h1>
            <p class="text-stone-500 text-sm mt-2">창업 및 입점 관련 제안 내용을 작성해 주세요.</p>
        </div>

        <form class="space-y-10">
            <section>
                <label class="block text-xs font-bold uppercase tracking-widest mb-4">브랜드 <span class="text-red-600">*</span></label>
                <div class="flex flex-wrap gap-2">
                    <label class="cursor-pointer">
                        <input type="checkbox" name="brand" class="brand-btn hidden" value="Oiso">
                        <span class="px-6 py-2.5 border border-stone-300 text-xs font-bold transition-all hover:border-primary inline-block">Oiso</span>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="brand" class="brand-btn hidden" value="Neulbom">
                        <span class="px-6 py-2.5 border border-stone-300 text-xs font-bold transition-all hover:border-primary inline-block">Neulbom Garden</span>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="brand" class="brand-btn hidden" value="MiMi">
                        <span class="px-6 py-2.5 border border-stone-300 text-xs font-bold transition-all hover:border-primary inline-block">MiMi Guksu</span>
                    </label>
                </div>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <section>
                    <label class="block text-xs font-bold uppercase tracking-widest mb-2">이름 <span class="text-red-600">*</span></label>
                    <input type="text" placeholder="성함을 입력해 주세요" required 
                        class="w-full border border-stone-300 bg-white p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
                </section>
                <section>
                    <label class="block text-xs font-bold uppercase tracking-widest mb-2">연락처 <span class="text-red-600">*</span></label>
                    <input type="tel" placeholder="010-0000-0000" required 
                        class="w-full border border-stone-300 bg-white p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
                </section>
            </div>

            <section>
                <label class="block text-xs font-bold uppercase tracking-widest mb-4">점포 유형 <span class="text-red-600">*</span></label>
                <div class="flex gap-8">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" name="store_type" class="w-4 h-4 text-primary focus:ring-primary border-stone-300">
                        <span class="text-sm text-stone-600 group-hover:text-black">본인 상가</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" name="store_type" class="w-4 h-4 text-primary focus:ring-primary border-stone-300">
                        <span class="text-sm text-stone-600 group-hover:text-black">중개 법인</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="radio" name="store_type" class="w-4 h-4 text-primary focus:ring-primary border-stone-300">
                        <span class="text-sm text-stone-600 group-hover:text-black">기타</span>
                    </label>
                </div>
            </section>

            <section class="space-y-3">
                <label class="block text-xs font-bold uppercase tracking-widest mb-2">점포 주소 <span class="text-red-600">*</span></label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select class="border border-stone-300 bg-white p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
                        <option>시 / 도 선택</option>
                        <option>서울특별시</option>
                        <option>경기도</option>
                    </select>
                    <input type="text" placeholder="시/군/구" class="md:col-span-2 border border-stone-300 bg-white p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
                </div>
                <input type="text" placeholder="상세 주소를 입력해 주세요" 
                    class="w-full border border-stone-300 bg-white p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
            </section>

            <section>
                <label class="block text-xs font-bold uppercase tracking-widest mb-2">상권 정보 / 제안 내용</label>
                <textarea rows="5" placeholder="제안하시는 상권의 특징이나 상세 내용을 입력해 주세요" 
                    class="w-full border border-stone-300 bg-white p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary"></textarea>
            </section>

            <section>
                <label class="block text-xs font-bold uppercase tracking-widest mb-2">파일 첨부</label>
                <div class="border-2 border-dashed border-stone-300 p-8 text-center bg-white hover:bg-stone-50 transition-all group relative cursor-pointer">
                    <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" multiple>
                    <span class="material-symbols-outlined text-stone-400 group-hover:text-primary text-4xl mb-2 transition-colors">upload_file</span>
                    <p class="text-sm font-medium text-stone-600">파일 찾기 또는 드래그하여 업로드</p>
                    <p class="text-[10px] text-stone-400 mt-2 tracking-tighter">최대 3개, 총 50MB 이하 (JPG, PNG, PDF, ZIP 등)</p>
                </div>
            </section>

            <div class="pt-8">
                <button type="submit" class="w-full bg-primary text-white py-5 font-bold uppercase tracking-[0.3em] text-xs hover:bg-[#3a5044] transition-all shadow-md">
                    제안 완료
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
